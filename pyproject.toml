[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Local-first AI operating system for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
aegis = "aegis.ui.cli.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# mic capture + VAD + speech-to-text
voice = ["sounddevice>=0.4.6", "webrtcvad-wheels>=2.0.11", "faster-whisper>=1.0"]
# spoken replies (`aegis voice --speak`); pulls in torch (CPU)
speak = ["kokoro>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
